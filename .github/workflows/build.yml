name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build-ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          sdk: v5.11.2
          bindings: vwtfafa/bindings
          bindings-ref: c0c808828d456e54164b60a589b0edd6172b327a
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: Input-Buffer-iOS
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
